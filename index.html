function addFromBank(all) {
  const tp = +$('bankTopic').value, replace = $('bankReplace').checked;
  let pool = MATH_BANK.filter(b => tp < 0 || b[4] === tp);
  if (!replace) { const have = new Set(quiz.questions.map(x => x.q)); pool = pool.filter(b => !have.has(b[0])); }
  if (!pool.length) return toast('لا توجد أسئلة جديدة متاحة في هذا الموضوع');
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const n = all ? pool.length : Math.max(1, Math.min(pool.length, parseInt($('bankN').value) || 10));
  const picked = pool.slice(0, n).map(b => ({ q: b[0], opts: b[1].slice(), correct: b[2], time: b[3] }));
  if (replace) { if (!confirm('سيتم حذف الأسئلة الحالية واستبدالها. متابعة؟')) return; quiz.questions = picked; }
  else quiz.questions.push(...picked);
  saveQuiz(); renderEditor(); toast(`تمت إضافة ${picked.length} سؤال ✅`);
}
function setQ(i, k, v) { quiz.questions[i][k] = v; saveQuiz(); }
function setOpt(i, j, v) { quiz.questions[i].opts[j] = v; saveQuiz(); }
function setCorrect(i, j) { quiz.questions[i].correct = j; saveQuiz(); }
function setTime(i, v) { quiz.questions[i].time = +v; saveQuiz(); }
function addQ() { quiz.questions.push({ q: '', opts: ['', '', '', ''], correct: 0, time: 20 }); saveQuiz(); renderEditor(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50); }
function delQ(i) {
  if (quiz.questions.length === 1) return toast('يجب أن تحتوي المسابقة على سؤال واحد على الأقل');
  quiz.questions.splice(i, 1); saveQuiz(); renderEditor();
}
function dupQ(i) { quiz.questions.splice(i + 1, 0, JSON.parse(JSON.stringify(quiz.questions[i]))); saveQuiz(); renderEditor(); }
function exportQuiz() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(quiz, null, 2)], { type: 'application/json' }));
  a.download = 'quiz-brahim-machet-k.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importQuiz(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.questions) || !d.questions.length) throw 0;
      quiz = {
        title: String(d.title || 'مسابقة'),
        questions: d.questions.map(x => ({
          q: String(x.q || ''),
          opts: [0, 1, 2, 3].map(j => String((x.opts || [])[j] || '')),
          correct: Math.min(3, Math.max(0, +x.correct || 0)),
          time: +x.time || 20
        }))
      };
      saveQuiz(); renderEditor(); toast('تم استيراد الأسئلة ✅');
    } catch (e) { toast('ملف غير صالح'); }
  };
  r.readAsText(f);
}
function validateQuiz() {
  for (let i = 0; i < quiz.questions.length; i++) {
    const q = quiz.questions[i], n = i + 1;
    if (!q.q.trim()) return `السؤال ${n}: اكتب نص السؤال`;
    if (q.opts.filter(o => o.trim()).length < 2) return `السؤال ${n}: أضف خيارين على الأقل`;
    if (!q.opts[q.correct].trim()) return `السؤال ${n}: الإجابة الصحيحة يجب أن تكون خياراً غير فارغ`;
  }
  return null;
}

      renderLobby();
    });
    peer.on('error', e => {
      if (!opened && e.type === 'unavailable-id' && n < 5) { try { peer.destroy(); } catch (x) {} return attempt(n + 1); }
      if (!opened) { toast('تعذر إنشاء اللعبة (' + e.type + ')'); renderEditor(); }
    });
  };
  attempt(0);
}

/* ---- Host networking ---- */
function onHostConn(c) {
  c.on('data', m => onHostMsg(c, m));
  c.on('close', () => {
    const p = Object.values(host?.players || {}).find(x => x.conn === c);
    if (!p) return;
    p.connected = false;
    if (host.phase === 'lobby') delete host.players[p.name];
    if (host.phase === 'lobby') updateLobby();
    else if (host.phase === 'question') { updateAnswered(); checkAllAnswered(); }
  });
}
function onHostMsg(c, m) {
  if (!host || !m) return;
  if (m.t === 'join') {
    const name = String(m.name || '').trim().slice(0, 16);
    if (!name) return c.send({ t: 'error', msg: 'اكتب اسماً مستعاراً' });
    const ex = host.players[name];
    if (ex && ex.connected && ex.conn !== c) return c.send({ t: 'error', msg: 'هذا الاسم مستخدم، اختر اسماً آخر' });
    if (!ex && host.phase !== 'lobby') return c.send({ t: 'error', msg: 'اللعبة بدأت بالفعل' });
    if (ex) { ex.conn = c; ex.connected = true; }
    else host.players[name] = { name, conn: c, connected: true, score: 0, streak: 0, cur: null, last: null };
    c.send({ t: 'joined', name, phase: host.phase });
    if (host.phase === 'lobby') updateLobby();
  } else if (m.t === 'answer') {
    const p = Object.values(host.players).find(x => x.conn === c);
    if (!p || host.phase !== 'question' || m.q !== host.qi || p.cur) return;
    const q = quiz.questions[host.qi];
    p.cur = { choice: +m.choice, elapsed: Math.min(q.time, (Date.now() - host.qStart) / 1000) };
    updateAnswered(); checkAllAnswered();
  }
}
const send = (p, msg) => { try { if (p.connected) p.conn.send(msg); } catch (e) {} };
const broadcast = msg => Object.values(host.players).forEach(p => send(p, msg));
const ranking = () => Object.values(host.players).sort((a, b) => b.score - a.score);

/* ---- Host game flow ---- */
function nextQuestion() {
  host.qi++;
  if (host.qi >= quiz.questions.length) return finishGame();
  const q = quiz.questions[host.qi];
  host.phase = 'question';
  Object.values(host.players).forEach(p => { p.cur = null; p.last = null; });
  host.qStart = Date.now();
  broadcast({ t: 'question', index: host.qi, total: quiz.questions.length, time: q.time, q: q.q, opts: q.opts });
  renderHostQuestion();
  clearInterval(host.timer);
  host.timer = setInterval(() => {
    const left = q.time - (Date.now() - host.qStart) / 1000;
    if ($('hTime')) { $('hTime').textContent = Math.max(0, Math.ceil(left)); $('hBar').style.width = Math.max(0, left / q.time * 100) + '%'; }
    if (left <= 0) endQuestion();
  }, 100);
}
function renderHostQuestion() {

  app(`<div class="min-h-screen flex flex-col p-4 max-w-5xl mx-auto">

    </div>
    <div class="grid grid-cols-2 gap-3 flex-1 content-start">
      ${q.opts.map((o, j) => o.trim() ? `<div class="ans c${j} text-white p-4 md:p-6 flex items-center gap-3 text-lg md:text-2xl min-h-[90px]">${shape(j)}<span class="flex-1">${esc(o)}</span></div>` : '').join('')}

function updateAnswered() {
  if (!host || !$('hAns')) return;
  const ps = Object.values(host.players).filter(p => p.connected);
  $('hTot').textContent = ps.length; $('hAns').textContent = ps.filter(p => p.cur).length;
}
function checkAllAnswered() {
  const ps = Object.values(host.players).filter(p => p.connected);
  if (host.phase === 'question' && ps.length && ps.every(p => p.cur)) setTimeout(() => host && host.phase === 'question' && endQuestion(), 400);
}
function endQuestion() {
  if (!host || host.phase !== 'question') return;
  clearInterval(host.timer);
  host.phase = 'results';
  const q = quiz.questions[host.qi];
  const counts = [0, 0, 0, 0];
  Object.values(host.players).forEach(p => {
    if (p.cur && p.cur.choice >= 0 && p.cur.choice < 4) counts[p.cur.choice]++;
    const ok = !!p.cur && p.cur.choice === q.correct;
    if (ok) {
      const pts = Math.round(500 + 500 * (1 - Math.min(1, p.cur.elapsed / q.time)));
      p.score += pts; p.streak++; p.last = { ok, pts };
    } else { p.streak = 0; p.last = { ok: false, pts: 0, answered: !!p.cur }; }
  });
  const rk = ranking();
  rk.forEach((p, i) => send(p, { t: 'result', ok: p.last.ok, pts: p.last.pts, score: p.score, rank: i + 1, total: rk.length, streak: p.streak, answered: !!p.cur, correct: q.correct }));
  const max = Math.max(1, ...counts);
  app(`<div class="min-h-screen flex flex-col p-4 max-w-4xl mx-auto">
    <div class="card p-5 text-center mb-5 mt-4"><div class="text-xl md:text-3xl font-black">${esc(q.q)}</div></div>

        <div class="w-full rounded-t-xl c${j} ${j === q.correct ? 'ring-4 ring-white' : 'opacity-45'}" style="height:${Math.max(8, counts[j] / max * 85)}%"></div>
        <div class="w-9 h-9 mt-2">${SHAPE_SVG[j]}</div>
        ${j === q.correct ? '<div class="text-2xl">✅</div>' : ''}
      </div>` : '<div></div>').join('')}
    </div>
    <div class="card p-4 text-center font-black text-lg text-green-700 mb-5">الإجابة الصحيحة: ${esc(q.opts[q.correct])}</div>
    <div class="text-center"><button onclick="renderLeaderboard()" class="btn bg-white text-purple-900 text-xl px-10">🏆 الترتيب</button></div>
  </div>`);
}
function renderLeaderboard() {

function renderJoin(msg) {
  cleanup();
  const pin = new URLSearchParams(location.search).get('pin') || '';
  const savedName = (() => { try { return localStorage.getItem('bmk_nick') || ''; } catch (e) { return ''; } })();
  app(`<div class="max-w-sm mx-auto p-5 min-h-screen flex flex-col justify-center">
    ${brand()}
    <div class="card p-5 grid gap-3">

        class="pin text-center border-2 border-purple-200 rounded-xl p-3 font-black text-2xl focus:outline-none focus:border-purple-600">
      <input id="jname" maxlength="16" value="${esc(savedName)}" placeholder="اسمك المستعار"
        class="text-center border-2 border-purple-200 rounded-xl p-3 font-black text-xl focus:outline-none focus:border-purple-600">
      <button onclick="joinGame()" class="btn bg-[#26890c] text-white text-xl">انضمام!</button>
      <button onclick="renderHome()" class="text-purple-700 font-bold text-sm">← رجوع</button>
    </div>
  </div>`);

function joinGame() {
  const pin = $('jpin').value.trim(), name = $('jname').value.trim();
  if (!/^\d{6}$/.test(pin)) return toast('أدخل رمز PIN مكوناً من 6 أرقام');
  if (!name) return toast('اكتب اسماً مستعاراً');
  try { localStorage.setItem('bmk_nick', name); } catch (e) {}
  if (typeof Peer === 'undefined') return toast('تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت.');
  loading('جارٍ الانضمام…');
  const peer = new Peer();
  player = { peer, name, pin, joined: false, ended: false, score: 0, timer: null, answered: false };
  const fail = m => { if (player && player.peer === peer) { clearTimeout(player.to); renderJoin(m); } };
  player.to = setTimeout(() => { if (!player.joined) fail('تعذر الاتصال باللعبة. تأكد من الرمز وحاول مجدداً.'); }, 12000);
  peer.on('error', e => fail(e.type === 'peer-unavailable' ? 'لا توجد لعبة بهذا الرمز' : 'خطأ في الاتصال (' + e.type + ')'));
  peer.on('open', () => {
    const conn = peer.connect('bmk-' + pin, { reliable: true });
    player.conn = conn;
    conn.on('open', () => conn.send({ t: 'join', name }));
    conn.on('data', onPlayerMsg);
    conn.on('close', () => {
      if (player && player.peer === peer && !player.ended) {
        clearInterval(player.timer);
        app(`<div class="min-h-screen flex flex-col items-center justify-center gap-4 p-6 text-center">
          <div class="text-6xl">📡</div><div class="font-black text-2xl">انقطع الاتصال باللعبة</div>
          <button onclick="renderJoin()" class="btn bg-white text-purple-900">إعادة الانضمام</button></div>`);
      }
    });
  });
}
function playerScreen(inner, bg) {
  app(`<div class="min-h-screen flex flex-col ${bg || ''}">
    <div class="flex items-center justify-between p-3 bg-black/25 font-bold">
      <span class="truncate">${esc(player.name)}</span><span>⭐ ${player.score}</span></div>
    ${inner}</div>`);
}
function onPlayerMsg(m) {
  if (!player || !m) return;
  if (m.t === 'error') { player.ended = true; clearTimeout(player.to); return renderJoin(m.msg); }
  if (m.t === 'kick') { player.ended = true; return renderJoin('تمت إزالتك من اللعبة'); }
  if (m.t === 'joined') {
    player.joined = true; clearTimeout(player.to);
    return playerScreen(`<div class="flex-1 flex flex-col items-center justify-center gap-3 text-center p-6">
      <div class="text-6xl">🎉</div><div class="font-black text-3xl">أنت داخل اللعبة!</div>
      <div class="text-white/80 font-bold">شاهد اسمك على الشاشة… في انتظار بدء المسابقة</div></div>`);
  }
  if (m.t === 'question') return playerQuestion(m);
  if (m.t === 'result') {
    clearInterval(player.timer); player.score = m.score;
    const ok = m.ok;
    return playerScreen(`<div class="flex-1 flex flex-col items-center justify-center gap-3 text-center p-6 pop">
      <div class="text-8xl">${ok ? '✅' : (m.answered ? '❌' : '⏰')}</div>
      <div class="font-black text-4xl">${ok ? 'إجابة صحيحة!' : (m.answered ? 'إجابة خاطئة' : 'انتهى الوقت')}</div>
      ${ok ? `<div class="font-black text-3xl text-yellow-300">+${m.pts}</div>` : ''}
      ${m.streak >= 2 ? `<div class="font-bold">🔥 ${m.streak} إجابات صحيحة متتالية</div>` : ''}
      <div class="bg-black/25 rounded-xl px-6 py-3 font-black text-xl mt-2">المركز ${m.rank} من ${m.total}</div></div>`,
      ok ? 'bg-[#26890c]' : 'bg-[#e21b3c]');
  }
  if (m.t === 'end') {
    player.ended = true; clearInterval(player.timer); player.score = m.score;
    return playerScreen(`<div class="flex-1 flex flex-col items-center justify-center gap-3 text-center p-6 pop">
      <div class="text-7xl">${m.rank === 1 ? '🥇' : m.rank === 2 ? '🥈' : m.rank === 3 ? '🥉' : '🏁'}</div>
      <div class="font-black text-3xl">انتهت المسابقة</div>
      <div class="font-black text-5xl text-yellow-300">المركز ${m.rank}</div>
      <div class="font-bold">من ${m.total} لاعبين · ${m.score} نقطة</div>
      <button onclick="renderHome()" class="btn bg-white text-purple-900 mt-4">الصفحة الرئيسية</button></div>`);
  }
}
function playerQuestion(m) {
  clearInterval(player.timer);
  player.answered = false; player.qi = m.index;
  const t0 = Date.now();
  playerScreen(`<div class="px-3 pt-3 text-center">
      <div class="flex items-center justify-between text-sm font-bold mb-1"><span>${m.index + 1} / ${m.total}</span><span id="pTime" class="text-2xl font-black">${m.time}</span></div>
      <div class="h-2 rounded-full bg-white/20 overflow-hidden"><div id="pBar" class="h-full bg-yellow-300" style="width:100%"></div></div>
      <div class="font-bold mt-2 text-white/90 text-sm md:text-base">${esc(m.q)}</div>
    </div>
    <div id="pbtns" class="flex-1 grid grid-cols-2 gap-3 p-3">
      ${m.opts.map((o, j) => o.trim() ? `<button onclick="sendAnswer(${j})" class="ans c${j} flex flex-col items-center justify-center gap-2 text-white p-2 min-h-[130px]">
        <span class="w-14 h-14">${SHAPE_SVG[j]}</span><span class="text-sm md:text-lg px-1">${esc(o)}</span></button>` : '<div></div>').join('')}
    </div>`);
  player.timer = setInterval(() => {
    const left = m.time - (Date.now() - t0) / 1000;
    if ($('pTime')) { $('pTime').textContent = Math.max(0, Math.ceil(left)); $('pBar').style.width = Math.max(0, left / m.time * 100) + '%'; }
    if (left <= 0) { clearInterval(player.timer); if (!player.answered) waitingScreen('⏰ انتهى الوقت'); }
  }, 100);
}
function sendAnswer(j) {
  if (!player || player.answered) return;
  player.answered = true;
  try { player.conn.send({ t: 'answer', q: player.qi, choice: j }); } catch (e) {}
  waitingScreen('تم إرسال إجابتك ✨', j);
}
function waitingScreen(msg, j) {
  playerScreen(`<div class="flex-1 flex flex-col items-center justify-center gap-4 text-center p-6 ${j !== undefined ? 'c' + j : ''}">
    ${j !== undefined ? `<div class="w-24 h-24">${SHAPE_SVG[j]}</div>` : ''}
    <div class="font-black text-2xl">${msg}</div>
    <div class="font-bold text-white/80">في انتظار بقية اللاعبين…</div></div>`);
}

/* ============================================================
   Boot
   ============================================================ */
window.addEventListener('beforeunload', e => { if (host && host.phase !== 'lobby' && host.phase !== 'end') { e.preventDefault(); e.returnValue = ''; } });
if (new URLSearchParams(location.search).get('pin')) renderJoin(); else renderHome();
</script>
</body>
</html>
